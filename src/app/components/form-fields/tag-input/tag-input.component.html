<div class="form-field">
  @if (label()) {
  <label class="form-label" [attr.for]="inputId">{{ label() }}</label>
  }

  @if (values().length > 0) {
  <div class="flex flex-wrap gap-2">
    @for (value of values(); track $index) {
    <horde-badge variant="info">
      <span>{{ value }}</span>
      <button type="button" class="hover:bg-info-200 dark:hover:bg-info-800/50 rounded px-1 transition-colors ml-1"
        (click)="removeValue($index)" [attr.aria-label]="'Remove ' + value" title="Remove">
        ×
      </button>
    </horde-badge>
    }
  </div>
  }

  <div class="input-with-button relative" cdkOverlayOrigin #overlayOrigin="cdkOverlayOrigin">
    <input #inputElement type="text" class="form-input" [id]="inputId" [placeholder]="placeholder()"
      [(ngModel)]="newValue" (ngModelChange)="newValue.set($event)" (input)="handleInput()" (focus)="handleFocus()"
      (keydown)="handleKeyDown($event)" (blur)="handleBlur()" [attr.aria-controls]="suggestionsId"
      [attr.aria-expanded]="showSuggestions()" [attr.aria-autocomplete]="suggestions().length > 0 ? 'list' : null"
      role="combobox" />
    <horde-button variant="primary" size="sm" (click)="addValue()" [disabled]="!newValue().trim()"
      aria-label="Add item">
      Add
    </horde-button>
  </div>

  <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="overlayOrigin"
    [cdkConnectedOverlayOpen]="showSuggestions() && filteredSuggestions().length > 0"
    [cdkConnectedOverlayPositions]="overlayPositions" [cdkConnectedOverlayWidth]="triggerWidth()"
    [cdkConnectedOverlayPush]="true" [cdkConnectedOverlayHasBackdrop]="false">
    <div [id]="suggestionsId" class="autocomplete-dropdown autocomplete-dropdown-6" role="listbox"
      [attr.aria-label]="label() + ' suggestions'">
      @for (suggestion of filteredSuggestions(); track suggestion; let idx = $index) {
      <button type="button" class="autocomplete-item"
        [class.autocomplete-item-selected]="idx === selectedSuggestionIndex()" [class.autocomplete-item-matched]="
              newValue().trim() && suggestion.toLowerCase().includes(newValue().toLowerCase().trim())
            " (mousedown)="selectSuggestion(suggestion)" role="option"
        [attr.aria-selected]="idx === selectedSuggestionIndex()">
        {{ suggestion }}
      </button>
      }
    </div>
  </ng-template>
</div>
