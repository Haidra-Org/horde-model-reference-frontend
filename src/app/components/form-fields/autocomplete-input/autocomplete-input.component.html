<div class="form-field">
  @if (label()) {
    <label class="form-label" [attr.for]="inputId">{{ label() }}</label>
  }

  <div class="relative" cdkOverlayOrigin #overlayOrigin="cdkOverlayOrigin">
    <input
      #inputElement
      type="text"
      class="form-input"
      [id]="inputId"
      [placeholder]="placeholder()"
      [ngModel]="inputValue()"
      (ngModelChange)="inputValue.set($event)"
      (input)="handleInput()"
      (focus)="handleFocus()"
      (keydown)="handleKeyDown($event)"
      (blur)="handleBlur()"
      [attr.aria-controls]="suggestionsId"
      [attr.aria-expanded]="showSuggestions()"
      [attr.aria-label]="ariaLabel() || label() || placeholder()"
      [attr.aria-autocomplete]="suggestions().length > 0 ? 'list' : null"
      role="combobox"
    />

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="overlayOrigin"
      [cdkConnectedOverlayOpen]="showSuggestions() && filteredSuggestions().length > 0"
      [cdkConnectedOverlayPositions]="overlayPositions"
      [cdkConnectedOverlayWidth]="triggerWidth()"
      [cdkConnectedOverlayPush]="true"
      [cdkConnectedOverlayHasBackdrop]="false"
    >
      <div
        [id]="suggestionsId"
        class="autocomplete-dropdown"
        role="listbox"
        [attr.aria-label]="(ariaLabel() || label() || placeholder()) + ' suggestions'"
      >
        @for (suggestion of filteredSuggestions(); track suggestion; let idx = $index) {
          <button
            type="button"
            class="autocomplete-item"
            [class.autocomplete-item-selected]="idx === selectedSuggestionIndex()"
            [class.autocomplete-item-matched]="
              inputValue().trim() &&
              suggestion.toLowerCase().includes(inputValue().toLowerCase().trim())
            "
            (mousedown)="selectSuggestion(suggestion)"
            role="option"
            [attr.aria-selected]="idx === selectedSuggestionIndex()"
          >
            <span class="flex items-center justify-between gap-2 w-full">
              <span class="truncate">{{ suggestion }}</span>
              @if (getOptionAnnotation(suggestion); as annotation) {
                <span class="autocomplete-annotation">{{ annotation }}</span>
              }
            </span>
          </button>
        }
      </div>
    </ng-template>
  </div>
</div>
