<div
  class="modal-overlay"
  tabindex="0"
  (click)="onCancel()"
  (keydown)="$event.key === 'Escape' && onCancel()"
  aria-label="Close modal"
>
  <div
    class="modal-dialog"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    aria-modal="true"
    role="dialog"
  >
    <h2 class="modal-title">Login with API Key</h2>

    <div class="modal-content">
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="api-key-input" class="form-label">API Key</label>
          <input
            id="api-key-input"
            type="password"
            class="form-input w-full"
            placeholder="Enter your AI Horde API key"
            [(ngModel)]="apiKey"
            [disabled]="loading()"
            name="apikey"
            autocomplete="off"
            required
          />
          <p class="form-hint">
            Get your API key from
            <a
              href="https://aihorde.net/register"
              target="_blank"
              rel="noopener noreferrer"
              class="link"
              >aihorde.net</a
            >
          </p>
        </div>

        @if (error()) {
          <horde-alert variant="danger">
            {{ error() }}
          </horde-alert>
        }
      </form>
    </div>

    <div class="modal-actions">
      <horde-button variant="secondary" (click)="onCancel()" [disabled]="loading()">
        Cancel
      </horde-button>
      <horde-button
        type="submit"
        variant="primary"
        [loading]="loading()"
        (click)="onSubmit()"
        [disabled]="loading() || !apiKey().trim()"
      >
        @if (loading()) {
          <span>Verifying...</span>
        } @else {
          <span>Login</span>
        }
      </horde-button>
    </div>
  </div>
</div>
